name: Release

# Publishes to npm via Trusted Publishing (OIDC). No npm token is stored
# anywhere: classic tokens were permanently revoked in December 2025, and OIDC
# exchanges a short-lived GitHub identity for publish rights instead.
#
# PREREQUISITE — this workflow cannot succeed on a first publish.
# npm requires a package to already exist before a Trusted Publisher can be
# configured for it, so v1.0.0 must be published once manually. See Sprint 7 of
# masterplan.md for the exact bootstrap sequence.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Required for OIDC. Without it npm cannot verify the workflow's identity.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing requires Node >= 22.14.0 on the runner, which is
          # independent of the >=20 floor the published package declares.
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing requires npm >= 11.5.1, newer than the npm bundled
      # with any current Node release.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Fail if the tag does not match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # No --provenance flag needed: trusted publishing attaches provenance
      # automatically for public repos, which is what puts the badge on npmjs.com.
      - name: Publish
        run: npm publish --access public
